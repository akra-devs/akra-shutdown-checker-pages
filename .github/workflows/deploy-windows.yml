name: Deploy exact WhyShutdown Windows build

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Private Windows build workflow run ID
        required: true
        type: string
      source_run_attempt:
        description: Private Windows build workflow run attempt
        required: true
        default: "1"
        type: string
      source_sha:
        description: Exact private main commit SHA to deploy
        required: true
        type: string
      force:
        description: Redeploy even when the source commit is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: akra-whyshutdown-web-delivery
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: akra-devs/akra-shutdown-checker
  SOURCE_WORKFLOW: windows-release.yml
  TRANSFER_ARTIFACT: whyshutdown-site-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  fetch-private-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whyshutdown-production
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
    steps:
      - name: Resolve requested private build
        id: resolve
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          TARGET_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          REQUESTED_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          FORCE_DEPLOY: ${{ inputs.force }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${SOURCE_TOKEN:-}" ]]; then
            echo '::error title=Missing PERSONAL_TOKEN::The Pages repository cannot read the private source artifact.'
            exit 1
          fi

          if ! source_is_private="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${SOURCE_REPOSITORY}" --jq '.private')"; then
            echo '::error title=Private source unavailable::PERSONAL_TOKEN cannot read the private source repository.'
            exit 1
          fi

          if [[ "$source_is_private" != 'true' ]]; then
            echo '::error title=Source privacy changed::Expected the source repository to remain private.'
            exit 1
          fi

          if [[ ! "$REQUESTED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error title=Invalid source run::source_run_id must be numeric.'
            exit 1
          fi
          if [[ ! "$REQUESTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error title=Invalid source attempt::source_run_attempt must be a positive integer.'
            exit 1
          fi
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Invalid source SHA::source_sha must be a full lowercase commit SHA.'
            exit 1
          fi

          run_json=''
          for poll in $(seq 1 30); do
            run_json="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${SOURCE_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}")"
            if [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' ]]; then
              break
            fi
            echo "Private build is still finalizing (${poll}/30)."
            sleep 2
          done

          run_id="$(jq -r '.id // empty' <<<"$run_json")"
          run_attempt="$(jq -r '.run_attempt // empty' <<<"$run_json")"
          source_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
          source_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
          source_event="$(jq -r '.event // empty' <<<"$run_json")"
          source_status="$(jq -r '.status // empty' <<<"$run_json")"
          source_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          source_workflow_path="$(jq -r '.path // empty' <<<"$run_json")"

          if [[ "$run_id" != "$REQUESTED_RUN_ID" ||
                "$run_attempt" != "$REQUESTED_RUN_ATTEMPT" ||
                "$source_sha" != "$REQUESTED_SOURCE_SHA" ||
                "$source_branch" != 'main' ||
                ("$source_event" != 'push' && "$source_event" != 'workflow_dispatch') ||
                "$source_status" != 'completed' ||
                "$source_conclusion" != 'success' ||
                "$source_workflow_path" != ".github/workflows/${SOURCE_WORKFLOW}" ]]; then
            echo '::error title=Untrusted source build::The requested private run did not match the expected successful main release.'
            exit 1
          fi

          expected_artifact="whyshutdown-windows-${run_id}-${run_attempt}"
          artifacts_json="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${SOURCE_REPOSITORY}/actions/runs/${run_id}/artifacts")"
          artifact_id="$(jq -r --arg expected "$expected_artifact" '
            [.artifacts[] | select(.name == $expected and .expired == false)][0].id // empty
          ' <<<"$artifacts_json")"

          if [[ -z "$artifact_id" ]]; then
            echo "::error title=Build artifact missing::${expected_artifact} is missing or expired."
            exit 1
          fi

          current_sha=''
          if current_b64="$(GH_TOKEN="$TARGET_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/contents/.source-sha?ref=gh-pages" \
            --jq '.content' 2>/dev/null)"; then
            current_sha="$(base64 --decode <<<"$current_b64" | tr -d '\r\n')"
          fi

          if [[ "$source_sha" == "$current_sha" && "${FORCE_DEPLOY:-false}" != 'true' ]]; then
            echo "AKRA WhyShutdown ${source_sha} is already deployed."
            {
              echo 'deploy=false'
              echo "source_sha=${source_sha}"
              echo "source_run_id=${run_id}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo 'deploy=true'
            echo "artifact_id=${artifact_id}"
            echo "source_sha=${source_sha}"
            echo "source_run_id=${run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out download page
        if: steps.resolve.outputs.deploy == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download and verify private Windows artifact
        if: steps.resolve.outputs.deploy == 'true'
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          GH_TOKEN="$SOURCE_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${SOURCE_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          rm -f artifact.zip

          jq -e --arg source_sha "$SOURCE_SHA" '
            .source_sha == $source_sha
            and (.version | type == "string")
            and ([.artifacts.portable, .artifacts.installed] | all(
              (.file_name | type == "string")
              and (.sha256 | test("^[0-9a-f]{64}$"))
              and (.size_bytes | type == "number" and . > 0)
            ))
          ' artifact/release.json >/dev/null

          for kind in portable installed; do
            file_name="$(jq -r ".artifacts.${kind}.file_name" artifact/release.json)"
            expected_hash="$(jq -r ".artifacts.${kind}.sha256" artifact/release.json)"
            if [[ "$kind" == portable ]]; then
              pattern='^AKRA-WhyShutdown-v[0-9]+\.[0-9]+\.[0-9]+-portable-windows-x64-[0-9a-f]{7}\.zip$'
            else
              pattern='^AKRA-WhyShutdown-v[0-9]+\.[0-9]+\.[0-9]+-windows-x64-[0-9a-f]{7}\.zip$'
            fi
            if [[ ! "$file_name" =~ $pattern ]]; then
              echo "::error title=Unexpected file name::${file_name} is not a ${kind} release package name."
              exit 1
            fi

            test -s "artifact/${file_name}"
            test -s "artifact/${file_name}.sha256"
            test "$(stat -c '%s' "artifact/${file_name}")" -lt 100000000
            test "$(sha256sum "artifact/${file_name}" | cut -d' ' -f1)" = "$expected_hash"
            tr -d '\r' < "artifact/${file_name}.sha256" \
              | grep -Fxq "${expected_hash}  ${file_name}"

            rm -rf package
            mkdir package
            unzip -q "artifact/${file_name}" -d package
            if [[ "$kind" == portable ]]; then
              test -s package/AKRA-WhyShutdown-portable-windows-x64/powertrace.exe
              test -s package/AKRA-WhyShutdown-portable-windows-x64/powertrace-ui.exe
              test -s package/AKRA-WhyShutdown-portable-windows-x64/portable.mode
              test -s package/AKRA-WhyShutdown-portable-windows-x64/PORTABLE.md
            else
              test -s package/AKRA-WhyShutdown-windows-x64/target/release/powertrace.exe
              test -s package/AKRA-WhyShutdown-windows-x64/target/release/powertrace-ui.exe
              test -s package/AKRA-WhyShutdown-windows-x64/scripts/install.ps1
              test -s package/AKRA-WhyShutdown-windows-x64/scripts/uninstall.ps1
            fi
            if find package -type l -print -quit | grep -q .; then
              echo '::error title=Unsafe artifact::Symbolic links are not allowed in the Windows distribution.'
              exit 1
            fi
          done
          rm -rf package

          cp -a site publish
          cp artifact/release.json publish/release.json
          for kind in portable installed; do
            file_name="$(jq -r ".artifacts.${kind}.file_name" artifact/release.json)"
            expected_hash="$(jq -r ".artifacts.${kind}.sha256" artifact/release.json)"
            cp "artifact/${file_name}" "publish/${file_name}"
            cp "artifact/${file_name}.sha256" "publish/${file_name}.sha256"
            if [[ "$kind" == portable ]]; then
              stable_name='AKRA-WhyShutdown-portable-windows-x64.zip'
            else
              stable_name='AKRA-WhyShutdown-windows-x64.zip'
            fi
            cp "artifact/${file_name}" "publish/${stable_name}"
            printf '%s  %s\n' "$expected_hash" "$stable_name" > "publish/${stable_name}.sha256"
          done
          printf '%s\n' "$SOURCE_SHA" > publish/.source-sha
          touch publish/.nojekyll

      - name: Upload verified public bundle
        if: steps.resolve.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.TRANSFER_ARTIFACT }}
          path: publish
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

  publish-gh-pages:
    if: needs.fetch-private-build.outputs.deploy == 'true'
    needs: fetch-private-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whyshutdown-production
    permissions:
      contents: write
    steps:
      - name: Download verified public bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.TRANSFER_ARTIFACT }}
          path: publish

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.fetch-private-build.outputs.source_sha }}
        run: |
          set -euo pipefail

          version="$(jq -r '.version' publish/release.json)"
          portable_checksum="$(jq -r '.artifacts.portable.sha256' publish/release.json)"
          installed_checksum="$(jq -r '.artifacts.installed.sha256' publish/release.json)"
          short_sha="${SOURCE_SHA:0:7}"
          tag="windows-v${version}-${short_sha}"
          title="AKRA WhyShutdown v${version} (${short_sha})"

          cat > release-notes.md <<EOF
          Automated Windows x64 distribution.

          - Version: ${version}
          - Source commit: ${SOURCE_SHA}
          - Portable SHA-256: ${portable_checksum}
          - Installed SHA-256: ${installed_checksum}

          This build is not code-signed and may show a Windows SmartScreen warning.
          EOF

          assets=(
            publish/AKRA-WhyShutdown-portable-windows-x64.zip
            publish/AKRA-WhyShutdown-portable-windows-x64.zip.sha256
            publish/AKRA-WhyShutdown-windows-x64.zip
            publish/AKRA-WhyShutdown-windows-x64.zip.sha256
            publish/release.json
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Publish gh-pages branch
        shell: bash
        env:
          TARGET_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.fetch-private-build.outputs.source_sha }}
        run: |
          set -euo pipefail
          set +x

          test -s publish/index.html
          test -s publish/AKRA-WhyShutdown-portable-windows-x64.zip
          test -s publish/AKRA-WhyShutdown-portable-windows-x64.zip.sha256
          test -s publish/AKRA-WhyShutdown-windows-x64.zip
          test -s publish/AKRA-WhyShutdown-windows-x64.zip.sha256
          test -s publish/release.json
          test -f publish/.nojekyll
          test "$(cat publish/.source-sha)" = "$SOURCE_SHA"

          git init --initial-branch=gh-pages deployment
          rsync -a --exclude='.git/' publish/ deployment/
          git -C deployment config user.name 'github-actions[bot]'
          git -C deployment config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C deployment add --all
          git -C deployment commit -m "Deploy WhyShutdown from $SOURCE_SHA"
          git -C deployment remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          umask 077
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${TARGET_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"

          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C deployment -c credential.helper= push --force origin HEAD:gh-pages
